[project]
name = "lahacks"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
fixtures = ["pandas"]
training = ["pandas", "statsmodels"]
receiver = [
    "bleakheart>=0.2.0",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "websockets>=17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
