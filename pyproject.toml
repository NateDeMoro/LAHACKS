[project]
name = "lahacks"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3",
    "lightgbm>=4.7.0",
    "openai>=3.35.1",
    "pydantic>=2,<3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
fixtures = ["pandas"]
training = [
    "pandas",
    "scikit-learn>=1.9.1",
    "statsmodels",
    "wfdb>=4.3.1",
]
receiver = [
    "bleakheart>=0.2.0",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "websockets>=17.2",
]
agent = [
    "httpx>=0.28.1",
    "uagents>=0.26.1",
]

[tool.uv]
package = false
default-groups = ["dev", "fixtures", "training", "receiver"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
